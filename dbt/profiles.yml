my_project:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', 5432) | int }}"
      user: "{{ env_var('DB_USER', 'my_weather_user') }}"
      password: "{{ env_var('DB_PASSWORD', 'my_weather_password') }}"
      dbname: "{{ env_var('DB_NAME', 'my_weather_db') }}"
      schema: dev
      threads: 1
