version: 2

models:
  - name: stg_weather_data
    description: Cleaned and deduplicated weather observations parsed from raw Weatherstack JSON payloads.
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: city
        tests:
          - not_null
      - name: temperature_c
        tests:
          - not_null
      - name: weather_date
        tests:
          - not_null

  - name: stg_ev_fleet_records
    description: Cleaned EV fleet operating records used for environmental performance analysis.
    columns:
      - name: vehicle_id
        tests:
          - not_null
          - unique
      - name: city
        tests:
          - not_null
      - name: observed_efficiency_kwh_per_100km
        tests:
          - not_null

  - name: int_ev_weather_joined
    description: EV fleet records joined to same-city same-day weather observations.
    columns:
      - name: vehicle_id
        tests:
          - not_null
          - unique
      - name: operational_risk_label
        tests:
          - not_null

  - name: fct_ev_environmental_performance
    description: Power BI fact table for vehicle-level EV efficiency and weather analysis.
    columns:
      - name: vehicle_id
        tests:
          - not_null
          - unique
      - name: region
        tests:
          - not_null
      - name: city
        tests:
          - not_null

  - name: mart_region_environment_summary
    description: City and region-level operating summary for environmental comparisons.
    columns:
      - name: region
        tests:
          - not_null
      - name: city
        tests:
          - not_null

  - name: mart_charging_planning_signals
    description: Power BI mart with simple charging capacity planning signals.
    columns:
      - name: charging_planning_signal
        tests:
          - not_null
