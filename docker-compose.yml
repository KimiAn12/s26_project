services:
  postgres:
    image: postgres:16
    container_name: ev_platform_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-my_weather_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_weather_password}
      POSTGRES_DB: ${POSTGRES_DB:-my_weather_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init_my_weather_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_weather_user} -d ${POSTGRES_DB:-my_weather_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: ev_platform_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-my_weather_user}:${DB_PASSWORD:-my_weather_password}@postgres:5432/${DB_NAME:-my_weather_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-my_weather_db}
      DB_USER: ${DB_USER:-my_weather_user}
      DB_PASSWORD: ${DB_PASSWORD:-my_weather_password}
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./api-request:/opt/airflow/api-request
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
    command: ["bash", "-c", "airflow db migrate && airflow users create --username \"$${AIRFLOW_ADMIN_USERNAME:-admin}\" --password \"$${AIRFLOW_ADMIN_PASSWORD:-admin}\" --firstname Admin --lastname User --role Admin --email \"$${AIRFLOW_ADMIN_EMAIL:-admin@example.com}\" || true"]

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: ev_platform_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-my_weather_user}:${DB_PASSWORD:-my_weather_password}@postgres:5432/${DB_NAME:-my_weather_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-my_weather_db}
      DB_USER: ${DB_USER:-my_weather_user}
      DB_PASSWORD: ${DB_PASSWORD:-my_weather_password}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./api-request:/opt/airflow/api-request
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
    command: ["airflow", "webserver"]

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: ev_platform_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-my_weather_user}:${DB_PASSWORD:-my_weather_password}@postgres:5432/${DB_NAME:-my_weather_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-my_weather_db}
      DB_USER: ${DB_USER:-my_weather_user}
      DB_PASSWORD: ${DB_PASSWORD:-my_weather_password}
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./api-request:/opt/airflow/api-request
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
    command: ["airflow", "scheduler"]

volumes:
  postgres_data:
